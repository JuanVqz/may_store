# This file configures Herb for your project and team.
# Settings here take precedence over individual editor preferences.
#
# Herb is a suite of tools for HTML+ERB templates including:
# - Linter: Validates templates and enforces best practices
# - Formatter: Auto-formats templates with intelligent indentation
# - Language Server: Provides IDE support (VS Code, Zed, Neovim, etc.)
#
# Website: https://herb-tools.dev
# Configuration: https://herb-tools.dev/configuration
# GitHub Repo: https://github.com/marcoroth/herb
#

version: 0.10.3

# Framework and template engine configuration
framework: actionview
template_engine: erubi

files:
  exclude:
    # Rails-generated static error pages, not hand-maintained
    - 'public/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'

# engine:
#   validators:
#     security: true       # default: true
#     nesting: true        # default: true
#     accessibility: true  # default: true

linter:
  enabled: true

  # # Exit with error code when diagnostics of this severity or higher are present
  # # Valid values: error (default), warning, info, hint
  # failLevel: warning

  # # Additional patterns beyond the defaults for linting
  # include:
  #   - '**/*.xml.erb'
  #
  # # Patterns to exclude from linting
  # exclude:
  #   - 'app/views/admin/**/*'

  # Rules Herb ships disabled by default that we opt into.
  rules:
    # Every <nav> needs a unique accessible name.
    html-navigation-has-label:
      enabled: true

    # <div> inside <label> and friends: invalid content model, breaks
    # label/control association in some assistive tech.
    html-no-block-inside-inline:
      enabled: true

    # autofocus yanks screen reader and keyboard users to a field without
    # context. Enabled so any new autofocus has to be argued for. The bill view
    # is the cashier's register screen: the cash amount is the only thing typed
    # on it, so focusing it on load is the point of the screen.
    a11y-no-autofocus-attribute:
      enabled: true
      exclude:
        - "app/views/orders/bills/show.html.erb"

    # Every partial declares its contract, so a caller that forgets a local
    # fails loudly instead of rendering nil into the page.
    erb-strict-locals-required:
      enabled: true

    # Partials that already declare strict locals must keep the blank line
    # after the declaration.
    actionview-strict-locals-first-line:
      enabled: true

    # The remaining default-off rules. None of them have anything to flag
    # today, so they are on as guardrails for new markup rather than as a
    # cleanup task.
    a11y-avoid-generic-link-text:
      enabled: true
    a11y-disabled-attribute:
      enabled: true
    a11y-nested-interactive-elements:
      enabled: true
    a11y-no-accesskey-attribute:
      enabled: true
    a11y-no-aria-label-misuse:
      enabled: true
    a11y-no-aria-unsupported-elements:
      enabled: true
    a11y-no-redundant-image-alt:
      enabled: true
    a11y-svg-has-accessible-text:
      enabled: true
    html-no-title-attribute:
      enabled: true

    # Allows control flow, assignments and side-effect calls, so it only
    # catches bare method calls in `<% %>` that belong in a helper.
    erb-no-silent-statement:
      enabled: true

  #   erb-no-extra-newline:
  #     enabled: false
  #
  #   # Rules can have 'include', 'only', and 'exclude' patterns
  #   some-rule:
  #     # Additional patterns to check (additive, ignored when 'only' is present)
  #     include:
  #       - 'app/components/**/*'
  #     # Don't apply this rule to files matching these patterns
  #     exclude:
  #       - 'app/views/admin/**/*'
  #
  #   another-rule:
  #     # Only apply this rule to files matching these patterns (overrides all 'include')
  #     only:
  #       - 'app/views/**/*'
  #     # Exclude still applies even with 'only'
  #     exclude:
  #       - 'app/views/admin/**/*'

formatter:
  enabled: false
  indentWidth: 2
  maxLineLength: 80

  # # Additional patterns beyond the defaults for formatting
  # include:
  #   - '**/*.xml.erb'
  #
  # # Patterns to exclude from formatting
  # exclude:
  #   - 'app/views/admin/**/*'

  # # Rewriters modify templates during formatting
  # rewriter:
  #   # Pre-format rewriters (modify AST before formatting)
  #   pre:
  #     - tailwind-class-sorter
  #   # Post-format rewriters (modify formatted output string)
  #   post: []
