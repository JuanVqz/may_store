version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: America/Mexico_City
  open-pull-requests-limit: 5
  groups:
    bundler:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: America/Mexico_City
  open-pull-requests-limit: 5
  groups:
    github-actions:
      patterns:
      - "*"
